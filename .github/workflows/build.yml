name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub release with this tag (e.g. v0.1.0). Leave empty for a normal build.'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  check:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  web:
    name: Web UI
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Self-contained (no CDN): phones load it from Haul on your computer.
      - run: flutter build web --release --no-web-resources-cdn
      - uses: actions/upload-artifact@v4
        with:
          name: web-ui
          path: build/web

  android:
    name: Android APKs
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --release --split-per-abi
      - name: Name the APKs
        run: |
          cd build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do mv app-$abi-release.apk Haul-android-$abi.apk; done
      - uses: actions/upload-artifact@v4
        with:
          name: Haul-android
          path: build/app/outputs/flutter-apk/Haul-android-*.apk

  linux:
    name: Linux
    needs: [check, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build linux --release
      - uses: actions/download-artifact@v4
        with:
          name: web-ui
          path: build/linux/x64/release/bundle/web
      - run: tar -C build/linux/x64/release -czf Haul-linux-x64.tar.gz bundle
      - uses: actions/upload-artifact@v4
        with:
          name: Haul-linux
          path: Haul-linux-x64.tar.gz

  windows:
    name: Windows
    needs: [check, web]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --release
      - uses: actions/download-artifact@v4
        with:
          name: web-ui
          path: build/windows/x64/runner/Release/web
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Haul-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Haul-windows
          path: Haul-windows-x64.zip

  macos:
    name: macOS
    needs: [check, web]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build macos --release
      - uses: actions/download-artifact@v4
        with:
          name: web-ui
          path: build/macos/Build/Products/Release/Haul.app/Contents/Resources/web
      # Adding files changes the bundle; re-sign it (ad hoc) so it launches.
      - run: codesign --force --deep --sign - build/macos/Build/Products/Release/Haul.app
      - run: ditto -c -k --keepParent build/macos/Build/Products/Release/Haul.app Haul-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Haul-macos
          path: Haul-macos.zip

  ios:
    name: iOS (unsigned)
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build ios --release --no-codesign
      # An unsigned .ipa: sign it with your Apple ID via AltStore/Sideloadly.
      - run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry Haul-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Haul-ios
          path: Haul-ios-unsigned.ipa

  release:
    name: Publish release
    # A pushed v* tag, or a manual run with a tag name: both publish.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    needs: [android, linux, windows, macos, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Haul-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Haul ${{ inputs.release || github.ref_name }}
          body_path: .github/release-notes.md
          files: dist/*
